version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agendabot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agendabot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agendabot}
      POSTGRES_DB: ${POSTGRES_DB:-agendabot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agendabot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: agendabot_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agendabot}:${POSTGRES_PASSWORD:-agendabot}@postgres:5432/${POSTGRES_DB:-agendabot}
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      - ./api:/app
      - /app/node_modules

volumes:
  postgres_data:
